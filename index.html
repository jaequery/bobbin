<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bobbin — design inspiration library</title>
  <meta name="description" content="Browse, search and filter real-world UI patterns across web, iOS and Android apps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Primary">
      <a class="logo" href="#/apps" aria-label="Bobbin home">
        <svg viewBox="0 0 46 46" aria-hidden="true">
          <circle cx="23" cy="23" r="20.5" fill="none" stroke="#111" stroke-width="4"/>
          <path d="M16.5 12.5v21M16.5 25.5a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0 -13 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="nav-item" id="about-btn" type="button"></button>
        <button class="btn-outline" id="reset-btn" type="button"></button>
      </div>
    </aside>

    <main class="main">
      <label class="search">
        <span class="sr-only">Search apps or UI patterns</span>
        <input id="q" type="search" autocomplete="off" placeholder="Search apps or patterns — try “Checkout”">
        <button class="clear-q" id="clear-q" type="button" aria-label="Clear search" hidden></button>
        <span class="kbd" id="search-icon" aria-hidden="true"></span>
      </label>
      <div class="toolbar" id="toolbar"></div>
      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Screen viewer"></div>

  <dialog id="about">
    <h2>About Bobbin</h2>
    <p>Bobbin is an open library of app screens for product designers. Browse by app or by screen, search by app name or UI pattern, and filter by platform, pattern and industry.</p>
    <p>Every app and screenshot here is an original placeholder.</p>
    <form method="dialog"><button class="btn-primary">Got it</button></form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
